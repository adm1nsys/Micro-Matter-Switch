name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    # macOS, like the Arduino IDE it was written in: the sketch includes MEvent.h as <Mevent.h>
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      # Same settings as in the README: Huge APP partition scheme, USB CDC on boot
      - name: Compile for the XIAO ESP32-C6
        run: |
          # Arduino wants the sketch folder named like the .ino
          mkdir -p "$RUNNER_TEMP/MMS"
          rsync -a --exclude .git --exclude docs --exclude Case --exclude ScanToAdd ./ "$RUNNER_TEMP/MMS/"
          arduino-cli compile --fqbn "esp32:esp32:XIAO_ESP32C6:PartitionScheme=huge_app,CDCOnBoot=cdc" --output-dir out "$RUNNER_TEMP/MMS"
      - uses: actions/upload-artifact@v4
        with:
          name: mms-xiao-esp32c6
          path: out/MMS.ino.merged.bin
