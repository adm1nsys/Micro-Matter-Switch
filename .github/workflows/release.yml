name: Release

# Publishing a release on GitHub builds the firmware and attaches it
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the firmware to'
        required: true

permissions:
  contents: write

jobs:
  firmware:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      # Same settings as in the README: Huge APP partition scheme, USB CDC on boot
      - name: Compile for the XIAO ESP32-C6
        run: |
          # Arduino wants the sketch folder named like the .ino
          mkdir -p "$RUNNER_TEMP/MMS"
          rsync -a --exclude .git --exclude docs --exclude Case --exclude ScanToAdd ./ "$RUNNER_TEMP/MMS/"
          arduino-cli compile --fqbn "esp32:esp32:XIAO_ESP32C6:PartitionScheme=huge_app,CDCOnBoot=cdc" --output-dir out "$RUNNER_TEMP/MMS"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/MMS.ino.merged.bin mms-xiao-esp32c6.bin
          gh release upload "$TAG" mms-xiao-esp32c6.bin --clobber
